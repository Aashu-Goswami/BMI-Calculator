<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript | BMI calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id = "container">
        <h1> BMI CALCULATOR</h1>
        <div class = "input">
            <p>Height (in cm)</p>
            <input type="text" placeholder="Height" id="height">
        </div>
        <div class = "input">
            <p>Weight (in Kg)</p>
            <input type="text" placeholder="weight" id="weight">
        </div>
        <button type="button" class="button">Calculate</button>
        <div class = "instructions">
            <p>BMI Weight Guide</p>
            <p>Under Weight = Less than 18.6</p>
            <p>Normal Range = 18.6 to 24.9</p>
            <p>Over Weight = More than 24.9</p>
        </div>
        <div id="result"></div>
        <div id="final"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
